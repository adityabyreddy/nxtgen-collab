<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}NxtGen Collab{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <style>
        body {
            background-color: #f6f8fa;
            color: #1f2328;
            font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
        }
        .navbar-github {
            background-color: #24292f;
        }
        .navbar-github .navbar-brand {
            color: #fff;
            font-weight: 600;
        }
        .navbar-github .navbar-brand svg {
            margin-right: 6px;
        }
        .card {
            border-color: #d0d7de;
        }
        .card:hover {
            border-color: #0969da;
        }
        a {
            color: #0969da;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        .btn-github {
            background-color: #1f883d;
            border-color: rgba(31,35,40,.15);
            color: #fff;
        }
        .btn-github:hover {
            background-color: #1a7f37;
            color: #fff;
        }
        .badge-role {
            background-color: #ddf4ff;
            color: #0969da;
            border: 1px solid #54aeff;
            font-weight: 500;
        }
        .repo-url {
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: .875rem;
        }
        footer {
            color: #656d76;
            font-size: .875rem;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-github navbar-expand" data-bs-theme="dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <svg height="24" width="24" viewBox="0 0 16 16" fill="#fff" aria-hidden="true">
                    <path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"></path>
                </svg>
                NxtGen Collab
            </a>
            <a class="btn btn-github btn-sm ms-auto" href="/projects/new">New project</a>
        </div>
    </nav>
    <main class="container py-4">
        {% block content %}{% endblock %}
    </main>
    <footer class="container text-center py-4">
        NxtGen Collab &mdash; project &amp; contributor tracking
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
